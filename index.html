<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF8F3"></head><body><title>대구읍성 복원 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 손 세로 앱 — 위 HUD · 가운데 지도/제작/복원 · 아래 탭. 넓은 화면에서는 430px 기둥을 가운데에 둔다.
   한 장의 낮 지도 위에서 노는 게임이라 밝은 테마 하나로 고정한다. */
:root{
  --paper:#FAF8F3; --card:#FFFFFF; --desk:#E6E3DA;
  --ink:#26282C; --sub:#6B6E74; --faint:#B4B6BA; --line:#E4E1D8;
  --green:#3F6A54; --green-d:#2E4F3F; --green-l:#DCE9E0;
  --gold:#B9862F; --gold-l:#F6EBCF;
  --stone:#BDB6A5; --stone-d:#968F7E; --stone-l:#E2DDD1; --hole:#45423D;
  --ground:#EEF0E7; --block:#DAE2D1; --ring:#F1E2BC; --ring-line:#A48D63;
  --shade:rgba(38,40,44,.44); --red:#B24E3B;
  --f-display:"Gowun Batang","Noto Serif KR","AppleMyungjo",serif;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(38,40,44,.12)}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);z-index:3}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--green-l)}
.avatar svg{width:30px;height:30px}
.who{min-width:0;flex:1}
.who b{display:block;font-size:14px;font-weight:700;line-height:1.2}
.who span{font-size:11.5px;color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700}
.pill svg{width:18px;height:18px}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card)}
.iconbtn svg{width:18px;height:18px}
.mode-tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--green);background:var(--green-l);border-radius:8px;padding:2px 6px;margin-left:4px;vertical-align:1px}

/* views */
main{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#v-map{overflow:hidden;background:var(--ground)}
#map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.mapctl{position:absolute;right:16px;bottom:132px;display:flex;flex-direction:column;gap:8px}
.gpspill{position:absolute;left:16px;bottom:132px;display:flex;align-items:center;gap:6px;padding:6px 11px 6px 9px;border-radius:999px;background:var(--card);box-shadow:0 2px 10px rgba(38,40,44,.16);font-size:11.5px;font-weight:700;color:var(--ink);pointer-events:none}
.gpspill i{width:8px;height:8px;border-radius:50%;background:#9AA0A6;flex:none}
.gpspill.good i{background:#3F9A5C}
.gpspill.ok i{background:#D9A23A}
.gpspill.bad i{background:#C2553F}
.gpspill.live i{animation:gpsblink .6s ease-out}
.gpspill small{font-weight:500;color:var(--sub)}
@keyframes gpsblink{0%{box-shadow:0 0 0 0 rgba(63,154,92,.6)}100%{box-shadow:0 0 0 7px rgba(63,154,92,0)}}
.mapctl button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 2px 10px rgba(38,40,44,.16);color:var(--ink)}
.mapctl svg{width:20px;height:20px}
#map text{font-family:var(--f-ui)}
.goal{position:absolute;left:16px;right:16px;top:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:0 4px 16px rgba(38,40,44,.12)}
.goal svg{width:22px;height:22px;flex:none}
.goal b{display:block;font-size:13.5px;line-height:1.35}
.goal span{display:block;font-size:11.5px;color:var(--sub)}
.goal .go{margin-left:auto;flex:none;font-size:12px;font-weight:700;color:var(--green);padding:6px 10px;border-radius:10px;background:var(--green-l)}
.mapcard{position:absolute;left:16px;right:16px;bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(38,40,44,.12)}
.mapcard > div{background:var(--card);padding:9px 12px}
.mapcard small{display:block;font-size:11px;color:var(--sub)}
.mapcard b{font-size:16px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.mapcard p{grid-column:1/-1;margin:0;background:#F7F5EF;padding:5px 12px;font-size:10.5px;color:var(--sub)}

/* panes (제작/복원) */
.pane{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.pane-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pane-head h2{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.01em}
.muted{color:var(--sub);font-size:12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec h3{font-size:14.5px;margin:0}
.sec span{font-size:11.5px;color:var(--sub)}
.sec span.g{color:var(--green)}

.facilities{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fac{border-radius:14px;padding:10px 8px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.fac svg{width:34px;height:34px}
.fac b{font-size:12.5px}
.fac span{font-size:10.5px;color:var(--sub)}
.fac.on{border:1.5px solid var(--green)}
.fac.on span{color:var(--green);font-weight:700}
.fac.off{background:#F1EFE9;color:var(--faint)}
.fac.off b{color:var(--sub)}

.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.res{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.res svg{width:26px;height:22px}
.res b{font-size:15px}
.res span{font-size:10.5px;color:var(--sub)}

.slot{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.slot .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--green-l)}
.slot .ic svg{width:28px;height:28px}
.slot b{font-size:13.5px}
.slot small{font-size:11px;color:var(--sub);margin-left:6px}
.slot .bar{height:7px}
.slot .left{text-align:right;font-size:11px;color:var(--sub);line-height:1.25}
.slot .left b{display:block;font-size:14px;color:var(--green)}
.slot.ready{background:#FCF6E7;border-color:#EBD9AE}
.slot.ready .ic{background:var(--gold-l)}
.slot.ready .bar i{background:var(--gold)}
.slot.empty{grid-template-columns:1fr;background:transparent;border:1.5px dashed #D6D2C7;color:var(--sub);font-size:12px;text-align:center;padding:12px}

.recipe{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.recipe .ic{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:var(--green-l)}
.recipe .ic svg{width:38px;height:38px}
.recipe b{font-size:14.5px}
.recipe .use{font-size:11px;color:var(--sub);margin-left:4px}
.recipe .in{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12px;color:var(--sub)}
.recipe .in em{font-style:normal;font-weight:700;color:var(--ink)}
.recipe .in em.short{color:var(--red)}
.recipe .st{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;font-weight:700;color:var(--green)}
.recipe .st svg{width:14px;height:14px}
.recipe.off .ic{background:#EFEDE7}
.recipe .exchhint{margin-top:4px;font-size:11.5px;color:var(--gold);font-weight:700;line-height:1.35}
.recipe .exchhint small{display:block;font-weight:500;color:#8A6420}
.exch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exchb{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.exchb:not(:disabled):active{background:var(--gold-l)}
.exchb:disabled{opacity:.45;cursor:default}
.exchb .sv{display:flex;flex-direction:column;align-items:center;gap:1px}
.exchb .sv svg{width:26px;height:22px}
.exchb .sv b{font-size:11.5px;font-weight:700;white-space:nowrap}
.exchb .arr{font-size:15px;color:var(--gold);font-weight:700;padding:0 2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;font-weight:700;font-size:13px;background:var(--green);color:#fff;white-space:nowrap}
.btn:disabled{background:#DAD8D2;color:#8E9095;cursor:default}
.btn.gold{background:var(--gold)}
.btn.wide{width:100%;height:50px;border-radius:16px;font-size:15px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--red);border:1px solid #E8C9C1}
.link{font-size:12.5px;font-weight:700;color:var(--green);padding:6px 0}

/* 복원 */
.gtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtab{flex:none;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.gtab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.gtab.lock{color:var(--faint);background:#F1EFE9}
.gtab svg{width:12px;height:12px}
.stage{position:relative;border-radius:18px;background:#E9EEF1;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.stage .cap{position:absolute;top:10px;right:10px;font-size:11.5px;font-weight:700;color:var(--green);background:#fff;border-radius:10px;padding:4px 9px}
.stage .cap.done{color:#fff;background:var(--green)}
.stage .lockmsg{position:absolute;inset:auto 0 12px 0;text-align:center;font-size:12.5px;font-weight:700;color:var(--sub)}
.gname{display:flex;align-items:baseline;gap:8px}
.gname h2{font-family:var(--f-display);font-size:26px;margin:0}
.track{display:flex;align-items:flex-start;padding:2px 6px}
.track .dot{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:44px;font-size:11.5px;color:var(--sub)}
.track .dot i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);background:#fff;display:grid;place-items:center}
.track .dot.done i{background:var(--green);border-color:var(--green)}
.track .dot.done i::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.track .dot.now{color:var(--ink);font-weight:700}
.track .dot.now i{border:2px solid var(--green)}
.track .dot.now i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.track .seg{flex:1;height:2px;background:var(--line);margin-top:9px}
.track .seg.done{background:var(--green)}
.needs{padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.needs h4{margin:0 0 10px;font-size:13.5px}
.needs .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.need{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#F2F0EA}
.need svg{width:26px;height:26px;flex:none}
.need b{display:block;font-size:12.5px}
.need span{font-size:12px;font-weight:700;color:var(--sub)}
.need.ok{background:var(--green-l)}
.need.ok span{color:var(--green)}

/* 탭 */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11.5px;color:var(--sub)}
.tab .tic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--green);font-weight:700}
.tab.on .tic{background:var(--green-l)}
.tab .dotb{position:absolute;top:6px;left:calc(50% + 14px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--card)}

/* 시트 · 모달 · 토스트 */
.backdrop{position:absolute;inset:0;background:var(--shade);z-index:10;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:86%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease}
.sheet.show{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:#D9D7D0;margin:0 auto 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--green-l);color:var(--green)}
.tag.gold{background:var(--gold-l);color:#8A6420}
.tag.ghost{background:#F0EEE8;color:var(--sub)}
.tag.purple{background:#EFE9F7;color:#5D3E8E}
.lm-title{font-family:var(--f-display);font-size:24px;margin:10px 0 2px}
.lm-addr{margin:0;font-size:12px;color:var(--sub);line-height:1.5}
.lm-addr a{color:var(--green);font-weight:700;text-decoration:none}
.lm-art{border-radius:14px;overflow:hidden;margin:10px 0}
.lm-art svg{display:block;width:100%;height:auto}
.lm-text{margin:0 0 12px;color:var(--sub);line-height:1.6;font-size:13px}
.rlabel{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:8px}
.rlabel span{font-size:11.5px;font-weight:500;color:var(--sub)}
.rewards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.rw{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:#F2F0EA}
.rw svg{width:28px;height:24px;flex:none}
.rw small{display:block;font-size:11px;color:var(--sub)}
.rw b{font-size:16px}
.rw.dim{opacity:.45}
.rewards.three{grid-template-columns:repeat(3,1fr);gap:6px}
.rewards.three .rw{gap:6px;padding:9px 8px}
.rewards.three .rw svg{width:24px;height:21px}
.note{font-size:11.5px;color:var(--sub);background:#F6F4EF;border-radius:10px;padding:8px 10px;margin-bottom:12px}
.sheet h2.plain{font-size:18px;margin:4px 0 4px}
.sheet p.plain{margin:0 0 14px;color:var(--sub);font-size:13px;line-height:1.55}
.devgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:#F0EEE8;margin:8px 0 12px}
.seg2 button{height:38px;border-radius:10px;font-weight:700;font-size:13px;color:var(--sub)}
.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stack{display:flex;flex-direction:column;gap:8px}

.modal{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:24px 16px;background:var(--shade)}
.mcard{width:100%;max-width:360px;background:var(--card);border-radius:22px;padding:18px 18px 16px;text-align:center;animation:pop .35s ease}
.mcard .stage{margin:4px 0 14px}
.mcard h2{font-family:var(--f-display);font-size:24px;margin:0 0 6px}
.mcard p{margin:0 0 16px;color:var(--sub);font-size:13px;line-height:1.6}
.mcard .eyebrow{font-size:11.5px;font-weight:700;color:var(--green);letter-spacing:.06em}

.toast{position:absolute;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:30;width:max-content;max-width:calc(100% - 32px);padding:10px 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.high{bottom:calc(170px + env(safe-area-inset-bottom,0px))}

/* 인트로 */
.intro{position:absolute;inset:0;z-index:40;background:var(--paper);overflow-y:auto}
.intro-in{min-height:100%;display:flex;flex-direction:column;gap:18px;padding:28px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.intro .hero{border-radius:20px;background:#E9EEF1;overflow:hidden}
.intro .hero svg{display:block;width:100%;height:auto}
.intro h1{font-family:var(--f-display);font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
.intro .lede{margin:0;color:var(--sub);line-height:1.65;font-size:13.5px;max-width:34em}
.intro .lede b{color:var(--ink);font-weight:700}
.intro h3{margin:0 0 8px;font-size:13.5px}
.chars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.char{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:12px}
.char svg{width:40px;height:40px}
.char.on{border-color:var(--green);background:var(--green-l);font-weight:700}
.modes{display:grid;gap:8px}
.modebtn{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.modebtn b{display:block;font-size:14px}
.modebtn span{display:block;font-size:12px;color:var(--sub);line-height:1.5;margin-top:2px}
.modebtn i{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint)}
.modebtn.on{border-color:var(--green)}
.modebtn.on i{border:6px solid var(--green)}

@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%{r:14;opacity:.6}100%{r:46;opacity:0}}
.lay.rise{animation:drop .68s cubic-bezier(.45,0,.6,1) both}
@keyframes drop{0%{transform:translateY(-90px);opacity:0}15%{opacity:1}62%{transform:translateY(3px)}76%{transform:translateY(-4px)}88%{transform:translateY(1px)}100%{transform:none;opacity:1}}

/* ── 이펙트 ── */
.fx{position:absolute;inset:0;z-index:35;pointer-events:none;overflow:hidden}
.fx .p{position:absolute;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;display:grid;place-items:center;border-radius:50%;background:#fff;border:2px solid var(--fx,#B9862F);box-shadow:0 3px 8px rgba(38,40,44,.22);will-change:transform,opacity}
.fx .p svg{width:24px;height:21px}
.fx .burst{position:absolute;width:0;height:0}
.fx .burst i{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;border:3px solid var(--fx);animation:fxring .7s ease-out forwards}
.fx .burst i.i2{animation-delay:.12s;border-width:2px}
.fx .burst b{position:absolute;left:-2px;top:-8px;width:4px;height:16px;border-radius:2px;background:var(--fx);opacity:0;animation:fxray .6s ease-out forwards}

const EXCH = { small: { to: 'mid', n: 3 }, mid: { to: 'big', n: 3 } };
// 이 레시피를 시작하려면 몇 번 바꿔야 하는지 { mid: 작은돌→중간돌 횟수, big: 중간돌→큰돌 횟수 } / 바꿔도 안 되면 null
function exchPlan(r) {
  const need = { big: 0, mid: 0, small: 0, ...r.inputs }, inv = S.inv;
  const big = Math.max(0, need.big - inv.big);
  const mid = Math.max(0, need.mid + big * EXCH.mid.n - inv.mid);
  if (need.small + mid * EXCH.small.n > inv.small) return null;
  return { big, mid };
}

function partsToMake(g) {
  const left = { seongdol: 0, dadeum: 0, choseok: 0 };
  GATES[g].stages.slice(S.stages[g]).forEach((st) => Object.entries(st.needs).forEach(([k, n]) => { left[k] += n; }));
  Object.keys(left).forEach((k) => { left[k] -= S.parts[k] + S.slots.filter((x) => x && x.r === k).length; });
  return left;
}

function near(l) { return dist(S.pos, l) <= radius(); }
function slotProg(s) { const r = recipe(s.r); const done = Math.min(r.steps, S.steps - s.start); return { r, done, left: r.steps - done, ratio: done / r.steps, ready: done >= r.steps }; }
function canStart(r) { return S.slots.some((x) => !x) && Object.entries(r.inputs).every(([k, n]) => S.inv[k] >= n); }
function gateDone(g) { return S.stages[g] >= GATES[g].stages.length; }
function gateOpen(g) { return g === 0 || gateDone(g - 1); }
function curGate() { return gateDone(0) ? (gateDone(1) ? 1 : 1) : 0; }
function canRestore(g) {
  if (!gateOpen(g) || gateDone(g)) return false;
  const st = GATES[g].stages[S.stages[g]];
  return Object.entries(st.needs).every(([k, n]) => S.parts[k] >= n);
}

function appXY(el) { const a = $('app').getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - a.left + r.width / 2, y: r.top - a.top + r.height / 2 }; }
function fxLayer() { let f = $('fx'); if (!f) { f = document.createElement('div'); f.id = 'fx'; f.className = 'fx'; $('app').appendChild(f); } return f; }

function bump(el) { if (el && el.animate) el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' }); }

// 아이콘이 from 에서 튀어 오른 뒤 target(하단 탭)으로 빨려 들어감
function flyIcons(from, keys, target, label, color, off = { dx: 0, dy: -30 }) {
  if (!target || !keys.length) return;
  const t = appXY(target);
  let landed = 0;
  keys.forEach((k, i) => {
    const p = fxEl('p', IC[k]); if (color) p.style.setProperty('--fx', color);
    const x1 = from.x + rnd(-85, 85), y1 = from.y - rnd(45, 125);
    const an = p.animate([
      { transform: `translate(${from.x}px,${from.y}px) scale(.3)`, opacity: 0, easing: 'cubic-bezier(.2,.9,.3,1)' },
      { transform: `translate(${x1}px,${y1}px) scale(1.15)`, opacity: 1, offset: .3, easing: 'ease-in-out' },
      { transform: `translate(${x1}px,${y1 + 6}px) scale(1)`, opacity: 1, offset: .46, easing: 'cubic-bezier(.55,0,.9,.55)' },
      { transform: `translate(${(x1 + t.x) / 2 + rnd(-40, 40)}px,${(y1 + t.y) / 2}px) scale(.85)`, opacity: 1, offset: .78, easing: 'cubic-bezier(.4,0,.9,.6)' },
      { transform: `translate(${t.x}px,${t.y}px) scale(.35)`, opacity: .3 },
    ], { duration: 1300, delay: 90 + i * 65, fill: 'both' });
    an.onfinish = () => {
      p.remove(); bump(target);
      if (++landed === keys.length && label) { const pl = fxEl('plus', label); pl.style.left = (t.x + off.dx) + 'px'; pl.style.top = (t.y + off.dy) + 'px'; setTimeout(() => pl.remove(), 1200); }
    };

    const step = (t) => { const k = Math.min(1, (t - t0) / 420); el.textContent = '+' + Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };

}

function walkTo(x, y, then) {

  const from = { ...S.pos }, d = dist(from, { x, y });

  const tick = (now) => {

/* GPS 모드 — 동성로 근처면 실제 좌표 그대로, 멀리 있으면 지금 위치를 출발점에 맞춘다 */

    const lw = project(gps.last), d = Math.hypot(w.x - lw.x, w.y - lw.y);
    const minMove = Math.max(4, Math.min(15, acc * 0.5));
    if (d >= minMove) { gps.last = pt; S.steps += Math.round(d / M_PER_STEP); stepped = true; checkCraft(); renderHUD(); }
  }
  // 화면: 받은 위치로 미끄러지듯 이동
  glideTo({ x: w.x + gps.off.x, y: w.y + gps.off.y }, stepped);
}
function glideTo(t, stepped) {
  const pending = glide ? glide.stepped : false;
  if (glide) cancelAnimationFrame(glide.raf);
  const from = { ...S.pos }, d = dist(from, t), changed = stepped || pending;
  if (d < 1.5) { glide = null; if (changed) { save(); renderAll(); } return; }
  if (d > 150) { glide = null; S.pos = t; save(); follow(); renderAll(); arrived(); return; }
  const dur = Math.max(300, Math.min(1200, gps.gap * 0.9)), t0 = performance.now();
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / dur), e = k * (2 - k);
    S.pos = { x: from.x + (t.x - from.x) * e, y: from.y + (t.y - from.y) * e };
    renderMe(); follow();
    if (k < 1) { glide.raf = requestAnimationFrame(tick); return; }
    glide = null; save();
    if (changed) renderAll(); else { renderMap(); renderGoal(); }
    arrived();
  };
  glide = { raf: requestAnimationFrame(tick), stepped: changed };
}
// GPS 상태 표시: 정확도 · 신호 끊김
function renderGpsPill(fresh) {
  const el = $('gpspill'); if (!el) return;
  if (!S || S.mode !== 'gps' || !S.started) { el.hidden = true; return; }
  el.hidden = false;
  const age = Date.now() - gps.at;
  let cls = '', txt;
  if (!gps.at) txt = 'GPS 찾는 중…';
  else if (age > 10000) txt = `GPS 신호 대기 중 <small>${Math.round(age / 1000)}초 전</small>`;
  else {
    const a = Math.round(gps.acc);
    cls = a <= 15 ? 'good' : (a <= 40 ? 'ok' : 'bad');
    txt = `GPS ±${a}m${a > 60 ? ' <small>약해서 멈춤</small>' : (a > 40 ? ' <small>걸음 미반영</small>' : '')}`;
  }
  el.className = 'gpspill ' + cls + (fresh ? ' live' : '');
  el.innerHTML = `<i></i>${txt}`;
  if (fresh) setTimeout(() => el.classList.remove('live'), 650);
}
setInterval(() => { if (S && S.mode === 'gps') renderGpsPill(); }, 2000);
function gpsFail(msg) {
  stopGPS(); S.mode = 'demo'; save(); renderAll();
  toast(`${msg} · 시연 모드로 진행해요`);
}
function setMode(m) {
  if (m === S.mode) return;
  S.mode = m; save();
  if (m === 'gps') startGPS(); else stopGPS();
  closeSheet(); renderAll();
}

/* ───────────── 인트로 ───────────── */
let pick = { char: 0, mode: 'demo' };
function renderIntro() {
  $('intro').innerHTML = `<div class="intro-in">
    <div class="hero">${gateArt(3, 2, -1)}</div>
    <h1>대구읍성 복원 게임</h1>
    <p class="lede">대구읍성은 1907년에 헐렸고, 지금의 <b>동성로 · 서성로 · 남성로 · 북성로</b>는 그 성벽 자리를 따라 난 길이에요. 복원단이 되어 동성로 일대 20곳을 걸으며 돌을 모으고, 걸음으로 부재를 만들어 사라진 성문을 다시 세워 보세요.</p>
    <div><h3>함께 걸을 캐릭터</h3><div class="chars">${CHARS.map((c, i) => `<button class="char${pick.char === i ? ' on' : ''}" data-act="pickChar" data-i="${i}">${avatarSVG(i)}${c.name}</button>`).join('')}</div></div>
    <div><h3>이동 방식</h3><div class="modes">
      <button class="modebtn${pick.mode === 'demo' ? ' on' : ''}" data-act="pickMode" data-m="demo"><i></i><div><b>시연 모드</b><span>지도를 눌러 이동해요. 어디서든 바로 해 볼 수 있어요.</span></div></button>
      <button class="modebtn${pick.mode === 'gps' ? ' on' : ''}" data-act="pickMode" data-m="gps"><i></i><div><b>GPS 모드</b><span>실제로 걸어서 이동해요. 동성로에서는 실제 위치 그대로, 다른 곳에서는 지금 위치를 출발점으로 맞춰요.</span></div></button>
    </div></div>
    <button class="btn wide" data-act="begin">복원 시작</button>
    <p class="muted" style="margin:0;text-align:center">MVP 범위 · 동소문 · 서소문 2개 문, 5단계</p>
  </div>`;
}

/* ───────────── 이벤트 ───────────── */
function setTab(t) {
  tab = t; closeSheet();
  if (t === 'restore') S.viewGate = gateOpen(1) && !gateDone(1) ? 1 : (gateDone(1) ? 1 : 0);
  renderAll();
  const v = $('v-' + t); if (v) v.scrollTop = 0;
}
document.addEventListener('click', (e) => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { setTab(tb.dataset.tab); return; }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  switch (act) {
    case 'pin': e.stopPropagation(); openLandmark(a.dataset.id); break;
    case 'claim': claim(a.dataset.id); break;
    case 'walkTo': {
      const l = LMS.find((x) => x.id === a.dataset.id); closeSheet();
      const d = dist(S.pos, l), k = Math.max(0, (d - WALK_STOP) / d);
      walkTo(S.pos.x + (l.x - S.pos.x) * k, S.pos.y + (l.y - S.pos.y) * k, () => openLandmark(l.id));
      break; }
    case 'craft': startCraft(a.dataset.id); break;
    case 'exch': exchStone(a.dataset.k); break;
    case 'craftExch': craftWithExch(a.dataset.id); break;
    case 'claimSlot': claimSlot(+a.dataset.i); break;
    case 'restore': doRestore(+a.dataset.g); break;
    case 'viewGate': {
      const g = +a.dataset.g;
      if (!gateOpen(g)) { toast('동소문을 먼저 복원하면 열려요'); }
      S.viewGate = g; closeModal(); if (tab !== 'restore') { tab = 'restore'; } renderAll(); break; }
    case 'gotoGate': { const g = +a.dataset.g; tab = 'restore'; S.viewGate = g; renderAll(); break; }
    case 'zoomIn': setZoom(view.k / 1.35); break;
    case 'zoomOut': setZoom(view.k * 1.35); break;
    case 'recenter': follow(true); break;
    case 'later': toast(`${LATER[+a.dataset.i].name} · ${LATER[+a.dataset.i].why}`); break;
    case 'toSeoso': closeModal(); tab = 'restore'; S.viewGate = 1; renderAll(); break;
    case 'closeModal': closeModal(); setTab('map'); break;
    case 'dev': openDev(); break;
    case 'addSteps': S.steps += +a.dataset.n; save(); checkCraft(); renderAll(); toast(`걸음 +${a.dataset.n}보`); break;
    case 'nextDay': S.day += 1; save(); closeSheet(); renderAll(); toast('하루가 지났어요 · 재방문 보너스를 다시 받을 수 있어요'); break;
    case 'mode': setMode(a.dataset.m); break;
    case 'reset':
      if (devArm && Date.now() - devArm < 4000) { stopGPS(); S = fresh(); save(); closeSheet(); tab = 'map'; pick = { char: 0, mode: 'demo' }; renderIntro(); $('intro').hidden = false; renderAll(); }
      else { devArm = Date.now(); a.textContent = '한 번 더 누르면 모든 진행이 지워져요'; }
      break;
    case 'pickChar': pick.char = +a.dataset.i; renderIntro(); break;
    case 'pickMode': pick.mode = a.dataset.m; renderIntro(); break;
    case 'begin':
      S.char = pick.char; S.mode = pick.mode; S.started = true; S.pos = { ...START }; save();
      $('intro').hidden = true; Object.assign(view, VIEW0); applyView(); renderAll();
      if (S.mode === 'gps') startGPS(); else toast('핀을 누르면 그곳까지 걸어가요');
      break;
  }
});
$('backdrop').addEventListener('click', closeSheet);
(() => {
  const svg = $('map'), ptrs = new Map();
  let drag = null, pinch = null, blockUntil = 0;
  svg.addEventListener('pointerdown', (e) => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: false };
    else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, k: view.k };
      if (drag) drag.moved = true;
    }
  });
  window.addEventListener('pointermove', (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size >= 2) {
      const [a, b] = [...ptrs.values()];
      setZoom(pinch.k * pinch.d / Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1));
      return;
    }
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 7) drag.moved = true;
      if (drag.moved) { view.cx = drag.cx - dx * view.k; view.cy = drag.cy - dy * view.k; applyView(); }
    }
  });
  const end = (e) => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) { if (drag && drag.moved) { blockUntil = performance.now() + 400; renderMap(); } drag = null; }
  };
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
  // 끌어서 지도를 옮긴 직후의 클릭은 무시 (핀 열기 · 걷기 방지)
  svg.addEventListener('click', (e) => { if (performance.now() < blockUntil) { e.stopPropagation(); e.preventDefault(); } }, true);
  svg.addEventListener('click', (e) => {
    if (e.target.closest('[data-act]')) return;
    if (S.mode !== 'demo') return;   // GPS 모드: 지도 빈 곳을 눌러도 아무 일 없음
    const p = svgPoint(e); walkTo(p.x, p.y);
  });
  svg.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(view.k * (e.deltaY > 0 ? 1.15 : 1 / 1.15)); }, { passive: false });
  window.addEventListener('resize', applyView);
})();

/* ───────────── 시작 ───────────── */
function start(data) {
  S = (data && data.S) || load() || fresh();
  readVars();
  buildMapStatic();
  view.cx = S.pos.x; view.cy = S.pos.y;
  document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = IC[el.dataset.icon]; });
  document.querySelector('[data-act="dev"]').innerHTML = IC.tool;
  if (!S.started) { pick = { char: S.char, mode: S.mode }; renderIntro(); $('intro').hidden = false; }
  renderAll();
  applyView();
  if (S.started && S.mode === 'gps') startGPS();
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
